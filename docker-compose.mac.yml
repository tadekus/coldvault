# macOS testing variant — run with:
#   docker compose -f docker-compose.mac.yml up -d --build
#
# Differences from the Debian setup: USB/external drives on macOS mount under
# /Volumes, which is mapped to /media inside the container so the watcher and
# canary workflow behave exactly like production.
services:
  coldvault:
    build: .
    container_name: coldvault-mac
    env_file: .env
    environment:
      COLDVAULT_PORT: 9999
      COLDVAULT_WATCH_DIRS: /media
      # Set TZ in .env (e.g. Europe/Prague); Docker Desktop's Linux VM has no
      # host /etc/localtime to inherit, so TZ is the reliable way on macOS.
      TZ: ${TZ:-}
    ports:
      - "${COLDVAULT_PORT:-9999}:9999"
    volumes:
      - ./data:/data
      # Restored files land here (read-write)
      - ./downloads:/downloads
      # /Volumes -> /media with rslave so drives mounted after the container
      # started can propagate in. NOTE: on macOS, Docker Desktop runs a Linux VM
      # and shares /Volumes over VirtioFS, so hot-plug visibility is best-effort —
      # for reliable testing, plug the drive in BEFORE `up`, or restart the
      # container after plugging in. If Docker Desktop rejects the propagation
      # setting, replace this block with the simple `- /Volumes:/media:ro`.
      - type: bind
        source: /Volumes
        target: /media
        read_only: true
        bind:
          propagation: rslave
      # Optional: a local folder for manual-upload tests. Uncomment both the
      # mount and the browse root:
      # - ${HOME}/coldvault-test:/testdata:ro
      # and add under environment:
      #   COLDVAULT_BROWSE_ROOTS: /testdata
    restart: unless-stopped
