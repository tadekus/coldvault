services:
  coldvault:
    build: .
    container_name: coldvault
    env_file: .env
    environment:
      # Fixed internal port; change the host port via COLDVAULT_PORT in .env
      COLDVAULT_PORT: 9999
      # Timezone for log/index timestamps. Defaults to the host tz via the
      # /etc/localtime mount below; set TZ in .env to override (e.g. Europe/Prague).
      TZ: ${TZ:-}
    ports:
      - "${COLDVAULT_PORT:-9999}:9999"
    volumes:
      # Persistent index database + logs
      - ./data:/data
      # Use the host's local time for timestamps (read-only)
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # Restored files are downloaded here (READ-WRITE). Point the left side
      # anywhere you want the files to land, e.g. /tank/restores:/downloads
      - ./downloads:/downloads
      # Debian automounts USB/external drives under /media/<user>/<label>.
      # propagation: rslave makes drives plugged in AFTER the container started
      # appear inside the container — without it, the canary watcher never sees
      # hot-plugged drives (Docker bind mounts default to rprivate). Requires the
      # host root to be a shared mount (systemd default; else run once:
      #   sudo mount --make-rshared /).
      - type: bind
        source: /media
        target: /media
        read_only: true
        bind:
          propagation: rslave
      # Machine-specific source folders for manual uploads go in
      # docker-compose.override.yml (copy docker-compose.override.example.yml).
      # That file is git-ignored and auto-merged by `docker compose up`, so a
      # `git pull` never conflicts with your local mounts.
    restart: unless-stopped
